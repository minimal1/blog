name: Mobile performance report

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "12.11.2"
          cache: true
      - run: pnpm install --frozen-lockfile
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: "158.0.8127.36"
      - name: Build and measure mobile performance
        run: pnpm performance
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: pnpm exec tsc --noEmit
      - run: node --experimental-strip-types --test --test-concurrency=1 tests/*.test.mjs
      - name: Keep Lighthouse reports in this workflow run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/performance/
            .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
